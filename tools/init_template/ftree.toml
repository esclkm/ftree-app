# Дерево «{title}». Этот файл отмечает корень дерева: движок (команда rodo) ищет его вверх от текущей папки или берёт
# FTREE_ROOT из ~/.config/ftree/env. Создан `rodo init` {date}. Правила — CLAUDE.md рядом.

[tree]
name = "{name}"
title = "{title}"
research_dir = "search"          # папка поиска в 3_research/: планы «что ещё искать», журнал, отчёты о находках

# Ветка — кровная родня одного из дедушек или бабушек. Порядок здесь = порядок веток в карточках и на сайте.
#   root   — карточка деда или бабушки: имя файла в 3_research/tree/people без .md (rodo assign-lineage считает
#            по ней поля lineage — руками их не правят);
#   keeper — кто ведёт ветку.
# Пример — раскомментировать, когда в дереве появится карточка корня:
# [[branch]]
# name = "Ясеневы"
# root = "Прокоп Ясенев"
# keeper = "Анна"

# ── Где хранить медиа ──────────────────────────────────────────────────────────────────────────────────────────────
# Фото, сканы, PDF и звук в git не лежат (там опись media/manifest.jsonl), копия — в хранилище, которое вы выберете.
# Пока здесь пусто, медиа никуда не отправляется: только на этом компьютере. Два хранилища:
#   [storage.media]   — открытое: фото под своими путями (можно дать родне посмотреть);
#   [storage.private] — закрытое: звук, PDF, документы живых; файлы названы по контрольной сумме.
# kind: "rclone" — любой remote программы rclone (Jottacloud, S3/R2, Google Drive …; заводит человек: rclone config,
#       для Jottacloud — помощник tools/setup/rclone_jotta.sh <имя>); "local" — папка на диске; "none" — никуда.
# encrypted = true — remote rclone вида crypt: имена и содержимое зашифрованы (rodo setup проверит; иначе — не отправит).
# Пример (пример — поменять на своё и раскомментировать):
# [storage]
# push_after_commit = true       # хук после коммита сам отправляет новое; без этого — только rodo media push
# [storage.media]
# kind = "rclone"
# address = "cloud:Семья/"
# [storage.private]
# kind = "rclone"
# address = "cloud-crypt:"
# encrypted = true
[storage]

# ── Сайт для родни ─────────────────────────────────────────────────────────────────────────────────────────────────
# Куда выкладывать — цели [[site.target]]. Пока целей нет, rodo site publish только собирает сайт на этом компьютере.
#   kind = "cloudflare-pages" — основной сайт, project = имя проекта, url = адрес (пароль и закрытые файлы работают
#          только здесь: секрет SITE_PASSWORD проекта); "folder" — основной, копия в папку path (любой хостинг статики,
#          без пароля); "netlify" (site = номер сайта, Site ID) и "cloudflare-worker" (name = имя) — зеркала, пересылают на основной.
#   role = "main" | "mirror" — обычно не нужно (следует из kind); manual = true — выкладывать только по имени.
# Пример (пример):
# [[site.target]]
# kind = "cloudflare-pages"
# project = "my-family"
# url = "https://my-family.example"
[site]
publish_after_push = false       # true — хук после push в основную ветку сам собирает и выкладывает сайт
open_until = ""                  # '' — сайт только по паролю
open_countries = []

# Привычные названия мест на языках сайта: по-русски = [по-польски, по-английски/испански]. Остальные — латиницей.
[places.latin]

# Адреса страниц мест, уже разосланные родне (переименовали место — адрес прежний).
[places.slug_keep]

[privacy]
living_years = 110               # живой — нет смерти и родился не раньше стольких лет назад (сайт прячет документы живых)
audio_name = ""                  # улица, по которой телефон называет записи разговоров («Садовая 5.m4a» → «Запись 5»)

[privacy.streets_translated]

# Заметки дерева к навыкам Claude (rodo skill-notes; навык сам вклеивает их при вызове)
[skills]
notes_dir = "3_research/search/навыки"

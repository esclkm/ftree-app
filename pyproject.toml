# Окружение Python для скриптов приложения: `uv sync` ставит его в .venv (точные версии — uv.lock).
# Здесь — только то, что нужно обычным скриптам (проверки, сборка сайта, MyHeritage).
# Тяжёлое — звук, реставрация фото — отдельными окружениями: tools/setup/asr.sh, tools/setup/photo.sh.
[project]
name = "ftree"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "pyyaml>=6.0",    # свойства карточек (cards, check_tree, myheritage_update)
    "pillow>=13",     # фото: сборка сайта, card_doctor, review_photos
    "numpy>=2",       # card_doctor (сравнение фото)
    "ged4py>=0.4",    # чтение выгрузки MyHeritage (myheritage_update)
    "telethon>=1.45.0",
    "qrcode>=8.2",
]

[tool.uv]
package = false
